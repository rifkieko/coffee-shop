<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <style>
    .frame{fill:#fff;stroke:#c0c0c0;stroke-width:2}
    .header{fill:#ffffff;stroke:#d9d9d9;stroke-width:2}
    .panel{fill:#ffffff;stroke:#c8c8c8}
    .text{font: 16px Arial, Helvetica, sans-serif; fill:#444}
    .title{font:bold 20px Arial, Helvetica, sans-serif}
    .muted{fill:#888; font:14px Arial, Helvetica, sans-serif}
    .btn{fill:#e8e8ff;stroke:#8a8acc}
    .danger{fill:#ffe8e8;stroke:#cc8a8a}
  </style>
  <rect class="frame" x="16" y="16" width="1408" height="868" rx="8"/>
  <rect class="header" x="32" y="32" width="1376" height="80" rx="8"/>
  <text class="title" x="64" y="82">Header · Profile</text>

  <g transform="translate(32,132)">
    <rect class="panel" x="0" y="0" width="900" height="320" rx="12"/>
    <text class="title" x="20" y="36">Informasi Profil</text>
    <text class="text" x="20" y="72">Nama, Email, Phone, …  [Simpan]</text>
    <rect class="btn" x="20" y="100" width="120" height="36" rx="18"/>
    <text class="text" x="48" y="124">Simpan</text>

    <rect class="panel" x="0" y="340" width="900" height="220" rx="12"/>
    <text class="title" x="20" y="376">Ubah Password</text>
    <text class="text" x="20" y="412">Password lama, baru, konfirmasi  [Simpan]</text>

    <rect class="panel" x="920" y="0" width="488" height="200" rx="12"/>
    <text class="title" x="940" y="36">Hapus Akun</text>
    <rect class="danger" x="940" y="60" width="160" height="36" rx="18"/>
    <text class="text" x="968" y="84">Hapus</text>
  </g>

  <text class="muted" x="32" y="888">profile.svg — profile wireframe</text>
</svg>

