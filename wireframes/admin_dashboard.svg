<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="950" viewBox="0 0 1440 950">
  <style>
    .frame{fill:#fff;stroke:#c0c0c0;stroke-width:2}
    .header{fill:#ffffff;stroke:#d9d9d9;stroke-width:2}
    .card{fill:#ffffff;stroke:#c8c8c8}
    .table{fill:#ffffff;stroke:#c8c8c8}
    .text{font: 16px Arial, Helvetica, sans-serif; fill:#444}
    .title{font:bold 20px Arial, Helvetica, sans-serif}
    .muted{fill:#888; font:14px Arial, Helvetica, sans-serif}
  </style>
  <rect class="frame" x="16" y="16" width="1408" height="918" rx="8"/>
  <rect class="header" x="32" y="32" width="1376" height="80" rx="8"/>
  <text class="title" x="64" y="82">Admin · Dashboard</text>

  <g transform="translate(32,132)">
    <rect class="card" x="0" y="0" width="330" height="120" rx="12"/>
    <rect class="card" x="350" y="0" width="330" height="120" rx="12"/>
    <rect class="card" x="700" y="0" width="330" height="120" rx="12"/>
    <rect class="card" x="1050" y="0" width="330" height="120" rx="12"/>
    <text class="text" x="20" y="40">Orders Today</text>
    <text class="text" x="370" y="40">Revenue</text>
    <text class="text" x="720" y="40">Items Low Stock</text>
    <text class="text" x="1070" y="40">New Customers</text>

    <rect class="table" x="0" y="150" width="1380" height="700" rx="10"/>
    <text class="title" x="20" y="186">Aktivitas Terbaru</text>
    <text class="muted" x="20" y="216">… tabel recent orders / updates …</text>
  </g>

  <text class="muted" x="32" y="940">admin_dashboard.svg — admin dashboard wireframe</text>
</svg>

