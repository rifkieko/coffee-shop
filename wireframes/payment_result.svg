<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700">
  <style>
    .frame{fill:#fff;stroke:#c0c0c0;stroke-width:2}
    .header{fill:#ffffff;stroke:#d9d9d9;stroke-width:2}
    .panel{fill:#ffffff;stroke:#c8c8c8}
    .text{font: 16px Arial, Helvetica, sans-serif; fill:#444}
    .title{font:bold 20px Arial, Helvetica, sans-serif}
    .muted{fill:#888; font:14px Arial, Helvetica, sans-serif}
    .btn{fill:#e8e8ff;stroke:#8a8acc}
  </style>
  <rect class="frame" x="16" y="16" width="1408" height="668" rx="8"/>
  <rect class="header" x="32" y="32" width="1376" height="80" rx="8"/>
  <text class="title" x="64" y="82">Header · Payment Result</text>

  <g transform="translate(32,132)">
    <rect class="panel" x="0" y="0" width="1376" height="420" rx="12"/>
    <text class="title" x="20" y="36">Pembayaran Sukses / Tertunda / Gagal</text>
    <text class="text" x="20" y="72">Rincian ringkas order + total</text>
    <rect class="btn" x="20" y="120" width="180" height="36" rx="18"/>
    <text class="text" x="56" y="144">Lihat Pesanan</text>
    <rect class="btn" x="216" y="120" width="200" height="36" rx="18"/>
    <text class="text" x="260" y="144">Kembali ke Menu</text>
  </g>

  <text class="muted" x="32" y="688">payment_result.svg — payment result wireframe</text>
</svg>

