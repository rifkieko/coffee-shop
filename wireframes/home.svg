<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024">
  <style>
    .frame{fill:#fff;stroke:#c0c0c0;stroke-width:2}
    .header{fill:#ffffff;stroke:#d9d9d9;stroke-width:2}
    .section{fill:#f7f7f7;stroke:#cfcfcf;stroke-width:2}
    .card{fill:#ffffff;stroke:#bfbfbf;stroke-width:2}
    .text{font: 16px Arial, Helvetica, sans-serif; fill:#444}
    .title{font:bold 20px Arial, Helvetica, sans-serif}
    .muted{fill:#888; font:14px Arial, Helvetica, sans-serif}
    .btn{fill:#e8e8ff;stroke:#8a8acc}
  </style>
  <rect class="frame" x="16" y="16" width="1408" height="992" rx="8"/>

  <!-- Header -->
  <rect class="header" x="32" y="32" width="1376" height="80" rx="8"/>
  <text class="title" x="64" y="82">Header · Logo · Nav (Home • Products • Facility • Reviews) · Icons (Search, Cart, Auth)</text>

  <!-- Hero -->
  <rect class="section" x="32" y="128" width="1376" height="220" rx="12"/>
  <text class="title" x="56" y="180">Hero</text>
  <text class="text" x="56" y="210">Headline, subtext, [Explore Menu]</text>
  <rect class="btn" x="56" y="226" width="180" height="36" rx="18"/>
  <text class="text" x="86" y="250">Explore Menu</text>

  <!-- Highlights -->
  <rect class="section" x="32" y="366" width="1376" height="150" rx="12"/>
  <text class="title" x="56" y="410">Highlights / Features</text>
  <rect class="card" x="56" y="430" width="300" height="70" rx="8"/>
  <rect class="card" x="376" y="430" width="300" height="70" rx="8"/>
  <rect class="card" x="696" y="430" width="300" height="70" rx="8"/>
  <rect class="card" x="1016" y="430" width="300" height="70" rx="8"/>

  <!-- Facility -->
  <rect class="section" x="32" y="530" width="1376" height="170" rx="12"/>
  <text class="title" x="56" y="574">Facility</text>
  <rect class="card" x="56" y="590" width="300" height="90" rx="8"/>
  <rect class="card" x="376" y="590" width="300" height="90" rx="8"/>
  <rect class="card" x="696" y="590" width="300" height="90" rx="8"/>
  <rect class="card" x="1016" y="590" width="300" height="90" rx="8"/>

  <!-- Reviews -->
  <rect class="section" x="32" y="714" width="1376" height="190" rx="12"/>
  <text class="title" x="56" y="758">Reviews</text>
  <rect class="card" x="56" y="774" width="430" height="110" rx="8"/>
  <rect class="card" x="506" y="774" width="430" height="110" rx="8"/>
  <rect class="card" x="956" y="774" width="430" height="110" rx="8"/>

  <!-- Footer note -->
  <text class="muted" x="32" y="1000">home.svg — landing wireframe</text>
</svg>

