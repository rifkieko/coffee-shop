<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000">
  <style>
    .frame{fill:#fff;stroke:#c0c0c0;stroke-width:2}
    .header{fill:#ffffff;stroke:#d9d9d9;stroke-width:2}
    .panel{fill:#ffffff;stroke:#c8c8c8}
    .text{font: 16px Arial, Helvetica, sans-serif; fill:#444}
    .title{font:bold 20px Arial, Helvetica, sans-serif}
    .muted{fill:#888; font:14px Arial, Helvetica, sans-serif}
    .btn{fill:#e8e8ff;stroke:#8a8acc}
  </style>
  <rect class="frame" x="16" y="16" width="1408" height="968" rx="8"/>

  <rect class="header" x="32" y="32" width="1376" height="80" rx="8"/>
  <text class="title" x="64" y="82">Header · Checkout</text>

  <g transform="translate(32,132)">
    <!-- left: form -->
    <rect class="panel" x="0" y="0" width="880" height="820" rx="12"/>
    <text class="title" x="20" y="36">Data Pelanggan</text>
    <text class="text" x="20" y="72">Nama, Telepon, Email</text>
    <text class="title" x="20" y="120">Nomor Meja</text>
    <text class="text" x="20" y="156">Scan QR atau input manual</text>
    <text class="title" x="20" y="204">Metode Pembayaran</text>
    <text class="text" x="20" y="240">Pilih metode (Midtrans)</text>

    <!-- right: summary -->
    <rect class="panel" x="896" y="0" width="512" height="400" rx="12"/>
    <text class="title" x="916" y="36">Ringkasan Pesanan</text>
    <text class="text" x="916" y="72">Item, qty, harga, total</text>
    <rect class="btn" x="916" y="330" width="200" height="36" rx="18"/>
    <text class="text" x="956" y="354">Buat Pesanan / Bayar</text>
  </g>

  <text class="muted" x="32" y="988">checkout.svg — checkout wireframe</text>
</svg>

